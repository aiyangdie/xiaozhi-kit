[project]
name = "xiaozhi-kit"
version = "0.1.0"
description = "Open-source toolkit for ESP32 Xiaozhi: serial CLI, Web console, and AI skill"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Xiaozhi Kit Contributors" }]
keywords = ["xiaozhi", "esp32", "serial", "cli", "iot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Hardware",
]
dependencies = [
  "pyserial>=3.5",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.3"]

[project.scripts]
xzkit = "xzkit_cli.cli:main"

[project.urls]
Homepage = "https://github.com/aiyangdie/xiaozhi-kit"
Documentation = "https://aiyangdie.github.io/xiaozhi-kit/"
Repository = "https://github.com/aiyangdie/xiaozhi-kit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/xzkit_core/xzkit_core",
  "packages/xzkit_cli/xzkit_cli",
  "packages/xzkit_server/xzkit_server",
]

[tool.hatch.build.targets.wheel.sources]
"packages/xzkit_core" = ""
"packages/xzkit_cli" = ""
"packages/xzkit_server" = ""

[tool.hatch.build.targets.sdist]
include = [
  "packages/",
  "apps/",
  "skills/",
  "examples/",
  "LICENSE",
  "NOTICE",
  "README.md",
  "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["packages/xzkit_core/tests"]
pythonpath = [
  "packages/xzkit_core",
  "packages/xzkit_cli",
  "packages/xzkit_server",
]

[tool.ruff]
line-length = 100
target-version = "py310"
